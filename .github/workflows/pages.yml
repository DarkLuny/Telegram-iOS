name: Publish API docs

# Publishes the ExteraPluginKit API page to GitHub Pages.
#
# The page is a single self-contained HTML file (inline CSS and JavaScript), so
# the build is a copy rather than a render step. The Markdown reference remains
# in submodules/ExteraPluginKit/docs/API.md as the source the page describes.

on:
  push:
    branches: [sideload]
    paths:
      - submodules/ExteraPluginKit/docs/API.md
      - docs/site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p docs/site/public
          cp docs/site/exterapluginkit-api.html docs/site/public/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4