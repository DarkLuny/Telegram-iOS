name: Build Telegram IPA (sideload)

# Produces an unsigned IPA that survives re-signing with a free Apple ID.
#
# A stock `make build` cannot do that: `Telegram/BUILD` stamps the binary with
# every right the App Store Telegram has (iCloud, Siri, CarPlay, Apple Pay,
# PushKit VoIP, communication notifications, filtering), and iOS kills the
# process at launch when the signature asks for a right the re-signing profile
# does not carry. `sideload_patch.py` narrows the entitlements to the set a
# working sideload build ships, drops the app extensions, and makes the main
# app fall back to Documents when the App Group entitlement is missing.

on:
  workflow_dispatch:

concurrency:
  group: telegram-ipa-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUILD_CONFIGURATION: release_arm64
  BAZEL_USER_ROOT: /private/var/tmp/_bazel_containerhost
  BAZEL_CACHE_DIR: ${{ github.workspace }}/.telegram-bazel-cache

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      # The upstream .gitmodules uses relative URLs ("../rlottie.git") which would
      # resolve to DarkLuny/rlottie.git inside a fork and fail.
      - name: Fix relative submodule URLs for forks
        run: |
          set -euo pipefail
          git config --file=.gitmodules submodule.submodules/rlottie/rlottie.url https://github.com/TelegramMessenger/rlottie.git
          git config --file=.gitmodules submodule.submodules/TgVoipWebrtc/tgcalls.url https://github.com/TelegramMessenger/tgcalls.git
          git submodule sync --recursive

      - name: Checkout submodules
        run: git submodule update --init --recursive --depth 1 --jobs 4

      - name: Select Xcode
        run: |
          set -euo pipefail
          REQUIRED="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"
          echo "versions.json wants Xcode $REQUIRED"
          CANDIDATE="/Applications/Xcode_${REQUIRED}.app"
          if [ ! -d "$CANDIDATE" ]; then
            CANDIDATE="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1 || true)"
          fi
          [ -n "$CANDIDATE" ] || { echo "::error::No Xcode 27.x found"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$CANDIDATE/Contents/Developer"
          xcodebuild -version
          echo "CPUS=$(sysctl -n hw.ncpu)"
          df -h /

      - name: Metal toolchain
        run: |
          set -euo pipefail
          if xcrun metal -v >/dev/null 2>&1; then
            echo "metal ok: $(xcrun -f metal)"
          else
            sudo xcodebuild -downloadComponent MetalToolchain
            rm -f "$(getconf DARWIN_USER_TEMP_DIR)/xcrun_db" || true
            xcrun metal -v
          fi

      - name: Free disk space
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf \
            /Users/runner/Library/Developer/CoreSimulator/Caches \
            /Library/Developer/CoreSimulator/Profiles/Runtimes/* \
            /Library/Developer/CoreSimulator/Images/* \
            /Library/Developer/CoreSimulator/Volumes \
            /Users/runner/.cargo \
            /Users/runner/.rustup \
            /usr/local/lib/android \
            /Users/runner/Library/Android \
            /Users/runner/Library/Developer/Xcode/DerivedData \
            /Users/runner/.gradle \
            /Users/runner/.m2 \
            /Applications/Xcode_26*.app \
            /Applications/Xcode_27.2*.app \
            /Applications/Xcode_27.0*.app || true
          df -h /

      - name: Restore Bazel cache
        id: bazel-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BAZEL_CACHE_DIR }}
          key: bazel-sideload-${{ hashFiles('versions.json') }}-${{ github.run_id }}
          restore-keys: |
            bazel-sideload-${{ hashFiles('versions.json') }}-
            bazel-sideload-

      - name: Apply sideload patch
        run: |
          set -euo pipefail
          python3 sideload_patch.py
          git --no-pager diff --stat
          echo "--- resulting entitlements template ---"
          sed -n '/name = "TelegramEntitlements"/,/^)/p' Telegram/BUILD
          echo "--- app groups fallback ---"
          grep -n "telegram-shared" submodules/TelegramUI/Sources/AppDelegate.swift

      - name: Write build configuration
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          # bundle_id/team_id must match the bundled fake-codesigning profiles
          # (ph.telegra.Telegraph / C67CF9S4VU); the sideload patch is what
          # keeps the resulting binary from asking for App-Store-only rights.
          # Siri and iCloud are switched off: their entitlements are gone, and
          # CKContainer.default() raises when the app has no iCloud container.
          cfg = json.load(open("build-system/appstore-configuration.json"))
          cfg["enable_siri"] = False
          cfg["enable_icloud"] = False
          api_id = os.environ.get("TELEGRAM_API_ID") or ""
          api_hash = os.environ.get("TELEGRAM_API_HASH") or ""
          if api_id and api_hash:
              cfg["api_id"] = api_id
              cfg["api_hash"] = api_hash
          with open("build-system/ci-configuration.json", "w") as f:
              json.dump(cfg, f, indent="\t")
              f.write("\n")
          print("api_id=%s bundle_id=%s team_id=%s siri=%s icloud=%s" % (
              cfg["api_id"], cfg["bundle_id"], cfg["team_id"],
              cfg["enable_siri"], cfg["enable_icloud"]))
          PY

      - name: Compute build number
        run: |
          set -euo pipefail
          APP_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')"
          BUILD_NUMBER="$(( $(cat build_number_offset) + $(git rev-list --count HEAD) ))"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Telegram $APP_VERSION ($BUILD_NUMBER)"

      - name: Build Telegram
        run: |
          set -euo pipefail
          mkdir -p "$BAZEL_CACHE_DIR" build/artifacts
          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$BAZEL_CACHE_DIR" \
            build \
            --configurationPath=build-system/ci-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration="$BUILD_CONFIGURATION" \
            --buildNumber="$BUILD_NUMBER" \
            --enableParallelSwiftmoduleGeneration \
            --outputBuildArtifactsPath=build/artifacts

      - name: Save Bazel cache
        if: ${{ !cancelled() && steps.bazel-cache.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ env.BAZEL_CACHE_DIR }}
          key: bazel-sideload-${{ hashFiles('versions.json') }}-${{ github.run_id }}

      - name: Collect and verify IPA
        run: |
          set -euo pipefail
          ls -la build/artifacts || true
          SRC="$(find build/artifacts bazel-bin/Telegram -maxdepth 2 -name 'Telegram.ipa' -type f 2>/dev/null | head -1 || true)"
          [ -n "$SRC" ] || { echo "::error::Telegram.ipa not found"; exit 1; }
          mkdir -p out
          IPA="out/Telegram-${APP_VERSION}-${BUILD_NUMBER}-sideload.ipa"
          cp -f "$SRC" "$IPA"
          ls -lh out

          python3 - "$IPA" <<'PY'
          import plistlib, struct, sys, zipfile

          path = sys.argv[1]
          with zipfile.ZipFile(path) as z:
              names = z.namelist()
              plugins = sorted({n.split("/")[3] for n in names if n.startswith("Payload/Telegram.app/PlugIns/")})
              exe = z.read("Payload/Telegram.app/Telegram")

          def entitlements(blob):
              ncmds = struct.unpack("<I", blob[16:20])[0]
              off = 32
              signature = None
              for _ in range(ncmds):
                  cmd, size = struct.unpack("<II", blob[off:off + 8])
                  if cmd == 0x1D:
                      data_off, data_size = struct.unpack("<II", blob[off + 8:off + 16])
                      signature = blob[data_off:data_off + data_size]
                      break
                  off += size
              if signature is None:
                  return None
              count = struct.unpack(">I", signature[8:12])[0]
              for k in range(count):
                  kind, offset = struct.unpack(">II", signature[12 + k * 8:20 + k * 8])
                  if kind == 5:
                      length = struct.unpack(">I", signature[offset + 4:offset + 8])[0]
                      body = signature[offset + 8:offset + 8 + length]
                      return plistlib.loads(body[body.find(b"<plist"):body.rfind(b"</plist>") + 8])
              return None

          ents = entitlements(exe) or {}
          has_provision = any(n.endswith("embedded.mobileprovision") for n in names)
          print("entries=%d plugins=%s" % (len(names), plugins or "none"))
          print("embedded.mobileprovision=%s" % has_provision)
          print("entitlements:")
          for key in sorted(ents):
              print("  %s = %s" % (key, ents[key]))

          # These are exactly the rights a sideload certificate can back.
          allowed = {
              "application-identifier",
              "aps-environment",
              "com.apple.security.application-groups",
              "get-task-allow",
              "com.apple.developer.team-identifier",
              "keychain-access-groups",
          }
          extra = sorted(set(ents) - allowed)
          if extra:
              print("::error::unexpected entitlements: %s" % extra)
              raise SystemExit(1)
          if not has_provision:
              print("::error::IPA has no embedded.mobileprovision")
              raise SystemExit(1)
          if plugins:
              print("::error::extensions were not stripped: %s" % plugins)
              raise SystemExit(1)
          print("entitlements are sideload-safe")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: Telegram-sideload-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: out/*.ipa
          retention-days: 7
          if-no-files-found: error